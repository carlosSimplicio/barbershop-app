x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  migrate:
    build:
      context: ./backend
      target: migrations
    profiles: [tools]
    environment:
      GOOSE_DBSTRING: ${DATABASE_URL}
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    logging: *default-logging

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      HTTP_ADDR: :8080
      LOG_LEVEL: ${LOG_LEVEL}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - logos_data:/var/lib/barbershop/logos
    networks:
      - data
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      APP_ADDRESS: ${APP_ADDRESS}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - proxy
      - edge
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

networks:
  data:
    internal: true
  proxy:
    internal: true
  edge:

volumes:
  postgres_data:
  logos_data:
  caddy_data:
  caddy_config:
