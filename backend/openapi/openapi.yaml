openapi: 3.1.0
info:
  title: Barbershop API
  version: 0.1.0
  description: API REST da plataforma de agendamento e gestao financeira.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Autentica proprietário ou profissional
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sessão criada
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPrincipal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /health:
    get:
      operationId: getHealth
      summary: Verifica se a API esta em execucao
      tags: [health]
      responses:
        "200":
          description: API saudavel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 32
    UserRole:
      type: string
      enum: [owner, professional]
    AuthPrincipal:
      type: object
      required: [user_id, establishment_id, email, role, password_change_required]
      properties:
        user_id:
          type: string
          format: uuid
        establishment_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        password_change_required:
          type: boolean
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Credenciais ou sessão inválidas
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Operação não permitida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Limite temporário de tentativas excedido
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Servico temporariamente indisponivel
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
