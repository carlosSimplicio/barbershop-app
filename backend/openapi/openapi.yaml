openapi: 3.1.0
info:
  title: Barbershop API
  version: 0.1.0
  description: API REST da plataforma de agendamento e gestao financeira.
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      operationId: postAuthRegister
      summary: Cadastra proprietário e estabelecimento
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Cadastro persistido e confirmação de e-mail solicitada
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/email-confirmation:
    post:
      operationId: postAuthEmailConfirmation
      summary: Solicita confirmação do e-mail do proprietário
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailConfirmationRequest"
      responses:
        "202":
          description: Solicitação recebida sem revelar o estado da conta
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/email-confirmation/verify:
    post:
      operationId: postAuthEmailConfirmationVerify
      summary: Confirma o e-mail e inicia a sessão do proprietário
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailConfirmationVerifyRequest"
      responses:
        "200":
          description: E-mail confirmado, trial iniciado e sessão criada
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPrincipal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/password/recovery:
    post:
      operationId: postAuthPasswordRecovery
      summary: Solicita link de recuperação da senha do proprietário
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryRequest"
      responses:
        "202":
          description: Solicitação recebida sem revelar o estado da conta
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/password/recovery/verify:
    post:
      operationId: postAuthPasswordRecoveryVerify
      summary: Redefine a senha do proprietário com link de uso único
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryVerifyRequest"
      responses:
        "204":
          description: Senha redefinida e sessões anteriores revogadas; nenhuma sessão criada
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Autentica proprietário ou profissional
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sessão criada
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPrincipal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: Encerra a sessão atual
      description: Revoga a sessão identificada por um access cookie válido; também limpa os cookies quando o access está ausente ou inválido, após CSRF válido.
      tags: [authentication]
      security:
        - csrfCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Sessão encerrada ou já ausente
          headers:
            Set-Cookie:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/me:
    get:
      operationId: getAuthMe
      summary: Consulta o usuário da sessão atual
      tags: [authentication]
      security:
        - accessCookie: []
      responses:
        "200":
          description: Identidade autenticada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPrincipal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/password/change:
    post:
      operationId: postAuthPasswordChange
      summary: Substitui a senha temporária obrigatória
      tags: [authentication]
      security:
        - accessCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Senha alterada e sessão reemitida
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /establishment:
    get:
      operationId: getEstablishment
      summary: Consulta o estabelecimento da sessão atual
      tags: [establishment]
      security:
        - accessCookie: []
      responses:
        "200":
          description: Estabelecimento autenticado e situação do trial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstablishmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /establishment/settings:
    get:
      operationId: getEstablishmentSettings
      summary: Consulta as configurações do estabelecimento do proprietário
      tags: [establishment]
      security:
        - accessCookie: []
      responses:
        "200":
          description: Configurações e estado de publicação do estabelecimento autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstablishmentSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      operationId: patchEstablishmentSettings
      summary: Atualiza os dados públicos e limites do estabelecimento
      tags: [establishment]
      security:
        - accessCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstablishmentSettingsPatchRequest"
      responses:
        "204":
          description: Configurações atualizadas
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /establishment/logo:
    put:
      operationId: putEstablishmentLogo
      summary: Envia ou substitui o logo do estabelecimento
      tags: [establishment]
      security:
        - accessCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        description: O corpo multipart aceita no máximo 2.162.688 bytes, incluindo até 65.536 bytes de envelope além do arquivo.
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/EstablishmentLogoUploadRequest"
      responses:
        "204":
          description: Logo associado ao estabelecimento
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Arquivo ou corpo multipart acima do limite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /public/establishments/{slug}/logo:
    get:
      operationId: getPublicEstablishmentLogo
      summary: Consulta o logo atual de um estabelecimento publicável
      tags: [public-establishment]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 63
        - name: If-None-Match
          in: header
          required: false
          description: ETag do logo previamente recebido para revalidar o cache.
          schema:
            type: string
      responses:
        "200":
          description: Conteúdo do logo atual
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "304":
          description: Logo sem alterações desde o ETag informado
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        "404":
          description: Estabelecimento inexistente, não publicável ou sem logo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /professionals:
    get:
      operationId: getProfessionals
      summary: Lista profissionais do estabelecimento do proprietário
      tags: [professionals]
      security:
        - accessCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 2147483647
            default: 0
      responses:
        "200":
          description: Página de profissionais do estabelecimento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: postProfessionals
      summary: Cadastra um profissional no estabelecimento do proprietário
      tags: [professionals]
      security:
        - accessCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfessionalRequest"
      responses:
        "201":
          description: Profissional cadastrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /health:
    get:
      operationId: getHealth
      summary: Verifica se a API esta em execucao
      tags: [health]
      responses:
        "200":
          description: API saudavel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: __Secure-barbershop_access
    csrfCookie:
      type: apiKey
      in: cookie
      name: __Secure-barbershop_csrf
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    CreateProfessionalRequest:
      type: object
      additionalProperties: false
      required: [name, email, temporary_password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        temporary_password:
          type: string
          minLength: 8
          maxLength: 32
    ProfessionalResponse:
      type: object
      required: [id, name, email, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        active:
          type: boolean
    ProfessionalListResponse:
      type: object
      required: [items, limit, offset, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProfessionalResponse"
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        has_more:
          type: boolean
    PasswordRecoveryRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    PasswordRecoveryVerifyRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          minLength: 8
          maxLength: 32
    EmailConfirmationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    EmailConfirmationVerifyRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [establishment_name, slug, time_zone, email, password]
      properties:
        establishment_name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 3
          maxLength: 63
          pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])$"
        time_zone:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 32
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 32
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [new_password]
      properties:
        new_password:
          type: string
          minLength: 8
          maxLength: 32
    UserRole:
      type: string
      enum: [owner, professional]
    AuthPrincipal:
      type: object
      required: [user_id, establishment_id, email, role, password_change_required]
      properties:
        user_id:
          type: string
          format: uuid
        establishment_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        password_change_required:
          type: boolean
    TrialStatus:
      type: string
      enum: [active, expired]
    EstablishmentTrial:
      type: object
      required: [status, starts_at, ends_at]
      properties:
        status:
          $ref: "#/components/schemas/TrialStatus"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
    EstablishmentResponse:
      type: object
      required: [id, name, slug, time_zone, trial]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        time_zone:
          type: string
        trial:
          oneOf:
            - $ref: "#/components/schemas/EstablishmentTrial"
            - type: "null"
    EstablishmentSettingsResponse:
      type: object
      required: [id, name, slug, time_zone, description, address, contact_phone, social_links, minimum_booking_notice_minutes, booking_horizon_days, customer_change_deadline_minutes, logo, time_zone_editable, can_write, slug_conflict, is_complete, is_publishable]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        time_zone:
          type: string
        description:
          type: [string, "null"]
        address:
          type: [string, "null"]
        contact_phone:
          type: [string, "null"]
        social_links:
          type: array
          items:
            $ref: "#/components/schemas/EstablishmentSocialLink"
        minimum_booking_notice_minutes:
          type: [integer, "null"]
          format: int32
        booking_horizon_days:
          type: [integer, "null"]
          format: int32
        customer_change_deadline_minutes:
          type: [integer, "null"]
          format: int32
        logo:
          oneOf:
            - $ref: "#/components/schemas/EstablishmentLogoMetadata"
            - type: "null"
        time_zone_editable:
          type: boolean
        can_write:
          type: boolean
        slug_conflict:
          type: boolean
        is_complete:
          type: boolean
        is_publishable:
          type: boolean
    EstablishmentSettingsPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        time_zone:
          type: string
          minLength: 1
        description:
          type: [string, "null"]
          maxLength: 500
        address:
          type: [string, "null"]
          maxLength: 500
        contact_phone:
          type: [string, "null"]
        social_links:
          oneOf:
            - type: array
              maxItems: 5
              items:
                $ref: "#/components/schemas/EstablishmentSocialLinkInput"
            - type: "null"
        minimum_booking_notice_minutes:
          type: [integer, "null"]
          format: int32
          minimum: 0
        booking_horizon_days:
          type: [integer, "null"]
          format: int32
          minimum: 1
        customer_change_deadline_minutes:
          type: [integer, "null"]
          format: int32
          minimum: 0
    EstablishmentLogoUploadRequest:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Imagem PNG, JPEG ou WebP de até 2.097.152 bytes e dimensões positivas de até 4.096 × 4.096 pixels.
    EstablishmentSocialLinkInput:
      type: object
      additionalProperties: false
      required: [label, url]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
        url:
          type: string
          format: uri
          maxLength: 2048
    EstablishmentSocialLink:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
        url:
          type: string
          format: uri
    EstablishmentLogoMetadata:
      type: object
      required: [url, content_type, byte_size, width, height]
      properties:
        url:
          type: [string, "null"]
          format: uri-reference
        content_type:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        byte_size:
          type: integer
          format: int64
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Credenciais ou sessão inválidas
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Operação não permitida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflito com o estado atual do recurso
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Falha interna ao concluir a solicitação
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Limite temporário de tentativas excedido
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Servico temporariamente indisponivel
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
