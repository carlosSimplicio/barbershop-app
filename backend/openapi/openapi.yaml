openapi: 3.1.0
info:
  title: Barbershop API
  version: 0.1.0
  description: API REST da plataforma de agendamento e gestao financeira.
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      operationId: postAuthRegister
      summary: Cadastra proprietário e estabelecimento
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Cadastro persistido e confirmação de e-mail solicitada
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/email-confirmation:
    post:
      operationId: postAuthEmailConfirmation
      summary: Solicita confirmação do e-mail do proprietário
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailConfirmationRequest"
      responses:
        "202":
          description: Solicitação recebida sem revelar o estado da conta
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/email-confirmation/verify:
    post:
      operationId: postAuthEmailConfirmationVerify
      summary: Confirma o e-mail e inicia a sessão do proprietário
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailConfirmationVerifyRequest"
      responses:
        "200":
          description: E-mail confirmado, trial iniciado e sessão criada
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPrincipal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Autentica proprietário ou profissional
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sessão criada
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPrincipal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/refresh:
    post:
      operationId: postAuthRefresh
      summary: Renova e rotaciona a sessão atual
      tags: [authentication]
      security:
        - refreshCookie: []
          csrfCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Sessão renovada
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: Encerra a sessão atual
      tags: [authentication]
      security:
        - csrfCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/OptionalRefreshCookie"
      responses:
        "204":
          description: Sessão encerrada ou já ausente
          headers:
            Set-Cookie:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/me:
    get:
      operationId: getAuthMe
      summary: Consulta o usuário da sessão atual
      tags: [authentication]
      security:
        - accessCookie: []
      responses:
        "200":
          description: Identidade autenticada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPrincipal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/password/change:
    post:
      operationId: postAuthPasswordChange
      summary: Substitui a senha temporária obrigatória
      tags: [authentication]
      security:
        - accessCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Senha alterada e sessão reemitida
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /establishment:
    get:
      operationId: getEstablishment
      summary: Consulta o estabelecimento da sessão atual
      tags: [establishment]
      security:
        - accessCookie: []
      responses:
        "200":
          description: Estabelecimento autenticado e situação do trial
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstablishmentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /health:
    get:
      operationId: getHealth
      summary: Verifica se a API esta em execucao
      tags: [health]
      responses:
        "200":
          description: API saudavel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: __Secure-barbershop_access
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-barbershop_refresh
    csrfCookie:
      type: apiKey
      in: cookie
      name: __Secure-barbershop_csrf
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    OptionalRefreshCookie:
      name: __Secure-barbershop_refresh
      in: cookie
      required: false
      schema:
        type: string
  schemas:
    EmailConfirmationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    EmailConfirmationVerifyRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [establishment_name, slug, time_zone, email, password]
      properties:
        establishment_name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          minLength: 3
          maxLength: 63
          pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])$"
        time_zone:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 32
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 32
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [new_password]
      properties:
        new_password:
          type: string
          minLength: 8
          maxLength: 32
    UserRole:
      type: string
      enum: [owner, professional]
    AuthPrincipal:
      type: object
      required: [user_id, establishment_id, email, role, password_change_required]
      properties:
        user_id:
          type: string
          format: uuid
        establishment_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        password_change_required:
          type: boolean
    TrialStatus:
      type: string
      enum: [active, expired]
    EstablishmentTrial:
      type: object
      required: [status, starts_at, ends_at]
      properties:
        status:
          $ref: "#/components/schemas/TrialStatus"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
    EstablishmentResponse:
      type: object
      required: [id, name, slug, time_zone, trial]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        time_zone:
          type: string
        trial:
          oneOf:
            - $ref: "#/components/schemas/EstablishmentTrial"
            - type: "null"
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Credenciais ou sessão inválidas
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Operação não permitida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: E-mail ou slug indisponível
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Falha interna ao concluir a solicitação
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Limite temporário de tentativas excedido
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Servico temporariamente indisponivel
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
