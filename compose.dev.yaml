services:
  backend:
    depends_on:
      mailpit:
        condition: service_healthy

  caddy:
    environment:
      APP_ADDRESS: https://localhost:8443

  mailpit:
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  mailpit_data:
